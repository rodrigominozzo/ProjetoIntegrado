# Copie para config.yaml. Tudo aqui é opcional: o que faltar usa o padrão de cortes/config.py.
idioma: pt

fontes:
  # Canais (ID que começa com UC...) que você tem autorização para cortar.
  # O modo automático acompanha as lives e gravações deles.
  canais_autorizados: []
  # Com true, o modo automático só usa os canais acima. Com false e a lista vazia,
  # ele busca no YouTube inteiro pelas lives/vídeos com mais exibições.
  exigir_autorizacao: true
  duracao_max_h: 6
  busca:
    consultas: ["live"]
    regiao: BR
    max_resultados: 10
    dias: 2

cortes:
  duracao: 30            # alvo, em segundos
  duracao_min: 20        # a IA pode encurtar ou estender o corte dentro desta faixa
  duracao_max: 45        # para começar no gancho e terminar no desfecho
  por_video: 5
  formato: auto          # auto (segue rostos) | vertical_blur | vertical_crop | original
  legendas: true
  fonte: Montserrat Black  # Montserrat ExtraBold | Poppins ExtraBold | Anton | Bangers
  karaoke: true          # destaca a palavra que está sendo falada
  tema: classico         # classico | impacto | neon | limpo | personalizado
  cor_destaque: "#FFE000" # usada só no tema personalizado
  capa: true             # gera a thumbnail e envia junto com o vídeo
  gancho: true           # frase de impacto fixa no topo (escrita pela IA)

  marca: "@GamePlayCortesBR"   # nome do canal no canto do vídeo e nos convites para seguir

edicao:
  dinamica: true         # troca de plano e zoom ao longo do corte
  abrir_no_rosto: true   # gameplay: começa no rosto do jogador
  cortar_silencios: true # tira pausas longas de fala (não se aplica a gameplay)
  pausa_minima: 1.2
  abertura_pico: true    # a IA pode abrir com 1,5 s do ápice
  barra_progresso: true
  realce: true           # acabamento de cor, nitidez e vinheta leve

narracao:
  ativa: false           # frase de abertura dita por voz sintética local (Piper)
  voz: vozes/pt_BR-faber-medium.onnx
  velocidade: 1.05
  volume: 1.0
  fundo: 0.25            # volume do vídeo enquanto a narração fala

ia:
  ativa: true
  nota_minima: 60        # 0–100; cortes abaixo disso são descartados
  modelos:               # um modelo para cada papel
    triagem: claude-haiku-5-5    # peneira rápida, só texto
    ao_vivo: claude-sonnet-5-5   # avaliação de picos durante a live
    final: claude-opus-5-5       # julgamento final, gancho e direção de edição

live:
  limiar: 4.0            # menor = mais cortes (e mais falsos positivos)
  pre: 22                # segundos antes do pico
  pos: 8                 # segundos depois
  espera: 90             # intervalo mínimo entre cortes da mesma live
  max_simultaneas: 2

publicar:
  creditar_fonte: true
  intervalo_min: 30      # espaçamento entre posts de vídeos gravados (lives publicam na hora)
  horarios: ""           # janelas para esses posts, ex.: "11:00-14:00, 18:00-23:30"
  youtube:
    ativo: true
    privacidade: public  # public | unlisted | private
    max_por_dia: 6
  instagram:
    ativo: true
    max_por_dia: 20

auto:
  intervalo_min: 30      # a cada quanto tempo procurar lives e vídeos novos
