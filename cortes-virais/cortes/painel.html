<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortes Virais</title>
<style>
:root {
  --fundo: #0d0f13; --painel: #161920; --painel2: #1d212a; --borda: #2a2f3a;
  --texto: #eceef2; --suave: #9aa1af; --fraco: #6b7280;
  --marca: #ff5a3c; --ok: #35c27a; --alerta: #f0b03a; --erro: #f0564f; --info: #5b9dff;
  --raio: 12px;
}
@media (prefers-color-scheme: light) {
  :root { --fundo: #f4f5f7; --painel: #ffffff; --painel2: #f0f1f4; --borda: #dcdfe6;
          --texto: #171a20; --suave: #555d6b; --fraco: #8a909c; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--fundo); color: var(--texto);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input { font: inherit; color: inherit; }
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
.pagina { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.logo { font-size: 20px; font-weight: 750; letter-spacing: -.02em; }
.logo span { color: var(--marca); }
.espaco { flex: 1; }
.selo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
        font-size: 12.5px; font-weight: 600; background: var(--painel2); color: var(--suave);
        white-space: nowrap; }
/* selos com texto longo (fila, previsão): quebram linha dentro do cartão */
.selo.quebra { white-space: normal; text-align: left; border-radius: 10px; max-width: 100%; line-height: 1.35; }
button.selo { border: 0; font-family: inherit; cursor: pointer; }
button.selo:hover { filter: brightness(1.25); }
.selo.ok { color: var(--ok); } .selo.alerta { color: var(--alerta); }
.selo.erro { color: var(--erro); } .selo.info { color: var(--info); }
.selo.teste { background: color-mix(in srgb, var(--alerta) 18%, transparent); color: var(--alerta); }

.envio { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio);
         padding: 14px; margin-bottom: 18px; }
.envio form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.envio input[type=text] { flex: 1 1 320px; min-width: 0; padding: 11px 14px; border-radius: 9px;
         border: 1px solid var(--borda); background: var(--fundo); outline: none; }
.envio input[type=text]:focus { border-color: var(--marca); }
.envio p { margin: 9px 2px 0; color: var(--suave); font-size: 13px; }
.chave { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
         font-weight: 600; font-size: 14px; }
.chave input { appearance: none; width: 38px; height: 22px; border-radius: 99px; margin: 0;
         background: var(--borda); position: relative; cursor: pointer; transition: background .15s; }
.chave input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
         border-radius: 50%; background: #fff; transition: transform .15s; }
.chave input:checked { background: var(--alerta); }
.chave.verde input:checked { background: var(--ok); }
.chave input:checked::after { transform: translateX(16px); }
.btn { padding: 10px 18px; border-radius: 9px; border: 1px solid var(--borda); background: var(--painel2);
       cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--suave); }
.btn.principal { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.principal:hover { filter: brightness(1.08); }
.btn.mini { padding: 5px 11px; font-size: 13px; border-radius: 7px; }
.btn.perigo:hover { border-color: var(--erro); color: var(--erro); }

nav { display: flex; gap: 4px; border-bottom: 1px solid var(--borda); margin-bottom: 18px;
      overflow-x: auto; }
nav button { background: none; border: 0; padding: 11px 15px; cursor: pointer; color: var(--suave);
      font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
nav button:hover { color: var(--texto); }
nav button.ativa { color: var(--texto); border-bottom-color: var(--marca); }
nav .conta { margin-left: 6px; font-size: 12px; padding: 1px 7px; border-radius: 99px;
      background: var(--painel2); color: var(--suave); }
nav .conta.viva { background: var(--marca); color: #fff; }

.aba { display: none; } .aba.ativa { display: block; }
.grade { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.cartao { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio);
          padding: 16px; min-width: 0; }
.cartao h3 { margin: 0; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.linha { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub { color: var(--suave); font-size: 13px; }
.vazio { text-align: center; color: var(--suave); padding: 48px 20px; border: 1px dashed var(--borda);
         border-radius: var(--raio); }
.vazio b { display: block; color: var(--texto); font-size: 16px; margin-bottom: 4px; }

.pulso { width: 9px; height: 9px; border-radius: 50%; background: var(--marca); flex: none;
         animation: pulso 1.4s infinite; }
.pulso.parado { background: var(--fraco); animation: none; }
@keyframes pulso { 50% { opacity: .35; } }
.medidas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 14px 0 10px; }
.medida { background: var(--painel2); border-radius: 9px; padding: 8px 10px; }
.medida b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.medida span { font-size: 11.5px; color: var(--suave); }
svg.grafico { display: block; width: 100%; height: 56px; background: var(--painel2); border-radius: 9px; }
.picos { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
.picos li { padding: 5px 0; border-top: 1px solid var(--borda); display: flex; gap: 8px; }
.picos time { color: var(--suave); font-variant-numeric: tabular-nums; flex: none; }

.barra { height: 7px; border-radius: 99px; background: var(--painel2); overflow: hidden; margin: 12px 0 6px; }
.barra i { display: block; height: 100%; background: var(--marca); border-radius: 99px; transition: width .4s; }
.barra.livre i { width: 35%; animation: vai 1.3s infinite ease-in-out; }
@keyframes vai { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.msg-erro { color: var(--erro); font-size: 13px; margin-top: 8px; overflow-wrap: anywhere; }

.analise { margin-top: 14px; border-top: 1px solid var(--borda); padding-top: 12px; }
svg.linha-tempo { display: block; width: 100%; height: 120px; background: var(--painel2); border-radius: 9px; }
.eixo { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--fraco); margin-top: 3px; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--suave); margin: 8px 0; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.rolagem { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; color: var(--suave); font-weight: 600; font-size: 12px; padding: 6px 8px; white-space: nowrap; }
td { padding: 8px; border-top: 1px solid var(--borda); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

.grupo { margin-bottom: 22px; }
.grupo > .linha, .cab-grupo > .linha { margin-bottom: 10px; }
.grupo h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
.cortes { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.corte { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio);
         overflow: hidden; display: flex; flex-direction: column; }
.corte video { width: 100%; aspect-ratio: 9/16; background: #000; display: block; object-fit: contain; }
.corte .sem-arquivo { aspect-ratio: 9/16; display: grid; place-items: center; background: var(--painel2);
         color: var(--fraco); font-size: 13px; }
.corte .corpo { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.corte h4 { margin: 0; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.nota { font-weight: 750; font-variant-numeric: tabular-nums; }
.criterios { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center;
             font-size: 12px; color: var(--suave); }
.criterios .barra { margin: 0; height: 5px; }
.criterios .barra i { background: var(--ok); }
.criterios b { color: var(--texto); font-variant-numeric: tabular-nums; }
.acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

.contas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: 16px; }
.contas .cartao b.grande { font-size: 24px; font-variant-numeric: tabular-nums; }
.celula { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; min-width: 150px; }

.passo { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--borda); }
.passo:first-of-type { border-top: 0; }
.passo .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
              font-weight: 700; background: var(--painel2); color: var(--suave); }
.passo.feito .num { background: var(--ok); color: #fff; }
.passo > div { flex: 1; min-width: 0; }
.passo ol { margin: 8px 0; padding-left: 20px; color: var(--suave); font-size: 14px; }
.passo ol li { margin: 3px 0; }
details > summary { cursor: pointer; color: var(--info); font-size: 14px; margin-top: 4px; }
.campo { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 6px 18px; align-items: center;
         padding: 12px 0; border-top: 1px solid var(--borda); }
.campo:first-of-type { border-top: 0; }
.campo label { font-weight: 600; }
.campo .sub { grid-column: 1; }
.campo .entrada { grid-column: 2; grid-row: 1 / span 2; justify-self: end; width: 100%; display: flex; justify-content: flex-end; }
.campo input[type=text], .campo input[type=number], .campo select, .linha-chave input, textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); font: inherit; }
.campo input[type=color] { width: 56px; height: 34px; padding: 2px; border-radius: 8px; border: 1px solid var(--borda); background: var(--fundo); }
textarea { min-height: 220px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
.linha-chave { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.linha-chave input { flex: 1 1 220px; }
.secao-config { margin-bottom: 16px; }
.secao-config h2 { margin: 0 0 2px; font-size: 17px; }
.rodape-config { position: sticky; bottom: 0; background: var(--fundo); padding: 12px 0; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--borda); }
@media (max-width: 640px) { .campo { grid-template-columns: 1fr; } .campo .entrada { grid-column: 1; grid-row: auto; justify-content: flex-start; } }
#avisos { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 9; }
.aviso { background: var(--painel); border: 1px solid var(--borda); border-left: 4px solid var(--ok);
         padding: 10px 14px; border-radius: 9px; max-width: 360px; box-shadow: 0 6px 24px #0005; font-size: 14px; }
.aviso.erro { border-left-color: var(--erro); }
@media (max-width: 520px) { .grade { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div class="logo">Cortes <span>Virais</span></div>
    <div class="espaco"></div>
    <div id="selos" class="linha"></div>
  </header>

  <section class="envio">
    <form id="form-envio">
      <input type="text" id="alvo" placeholder="Cole o link de um vídeo ou de uma live do YouTube" autocomplete="off">
      <label class="chave" title="Gera os cortes sem publicar nada"><input type="checkbox" id="teste"> Modo teste</label>
      <label class="chave" id="rotulo-live" hidden title="Reproduz o arquivo em tempo real, como se fosse uma live"><input type="checkbox" id="como-live"> Simular live</label>
      <button class="btn principal" type="submit">Enviar</button>
    </form>
    <p id="dica-envio"></p>
  </section>

  <nav id="abas">
    <button data-aba="lives">Lives <span class="conta" id="n-lives">0</span></button>
    <button data-aba="analises">Análises <span class="conta" id="n-analises">0</span></button>
    <button data-aba="cortes">Cortes <span class="conta" id="n-cortes">0</span></button>
    <button data-aba="publicacoes">Publicações <span class="conta" id="n-fila">0</span></button>
    <button data-aba="canais">Canais <span class="conta" id="n-canais">0</span></button>
    <button data-aba="monetizacao">Monetização</button>
    <button data-aba="config">Configurações</button>
  </nav>

  <section class="aba" id="aba-lives"><div class="grade" id="lista-lives"></div></section>
  <section class="aba" id="aba-analises"><div id="topo-analises"></div><div id="lista-analises" style="display:grid;gap:14px"></div></section>
  <section class="aba" id="aba-cortes">
    <div class="cartao linha" id="filtros-cortes" style="gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <label class="sub">Período
        <select id="filtro-periodo" aria-label="Filtrar cortes por período">
          <option value="tudo">Tudo</option><option value="hoje">Hoje</option><option value="ontem">Ontem</option>
          <option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option>
          <option value="mes">Este mês</option><option value="personalizado">Escolher datas…</option>
        </select></label>
      <span id="filtro-datas" class="linha" style="gap:8px">
        <label class="sub">De <input type="date" id="filtro-de" aria-label="Data inicial"></label>
        <label class="sub">Até <input type="date" id="filtro-ate" aria-label="Data final"></label>
      </span>
      <label class="sub">Situação
        <select id="filtro-situacao" aria-label="Filtrar cortes por situação">
          <option value="todos">Todos</option><option value="teste">Em teste</option>
          <option value="fila">Na fila ou falhou</option><option value="publicados">Publicados</option>
        </select></label>
      <span class="espaco"></span><span class="sub" id="contagem-cortes"></span>
    </div>
    <div id="lista-cortes"></div>
  </section>
  <section class="aba" id="aba-publicacoes">
    <div class="contas" id="contas"></div>
    <div class="cartao linha" style="gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <label class="sub">Mostrar
        <select id="filtro-fila" aria-label="Filtrar a lista de publicações">
          <option value="fila">Na fila (e enviando)</option><option value="aguardando">Aguardando você</option>
          <option value="falhou">Com falha</option><option value="publicados">Publicados</option>
          <option value="tudo">Tudo</option>
        </select></label>
      <span class="sub" id="contagem-fila"></span><span class="espaco"></span>
      <button class="btn mini perigo" data-acao="fila/esvaziar" data-confirmar="Tirar TODOS os cortes da fila? Eles voltam para “Aguardando você” (nada é apagado nem publicado)." data-ok="Fila esvaziada: os cortes voltaram para “Aguardando você”.">Tirar todos da fila</button>
    </div>
    <div class="cartao"><div class="rolagem"><table>
      <thead><tr><th>Corte</th><th>Nota</th><th>YouTube</th><th>Instagram</th><th>TikTok</th></tr></thead>
      <tbody id="fila"></tbody>
    </table></div><div id="fila-vazia"></div></div>
  </section>
  <section class="aba" id="aba-canais"><div id="lista-canais"></div></section>
  <section class="aba" id="aba-monetizacao"><div id="monetizacao"><div class="sub">Carregando…</div></div></section>
  <section class="aba" id="aba-config"><div id="config"><div class="sub">Carregando…</div></div></section>
</div>
<div id="avisos"></div>

<script>
const $ = s => document.querySelector(s);
// Só endereços https viram link: nada de javascript: nem de outros esquemas.
const link = u => /^https:\/\//i.test(String(u || "")) ? e(u) : "";
const e = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let estado = null;
const analises = {};        // video_id -> dados | "carregando" | "erro"
const abertas = new Set();  // análises expandidas

// ---------- utilidades ----------
function tempo(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0");
}
function ha(quando) {
  const s = Date.now() / 1000 - quando;
  if (s < 60) return "agora";
  if (s < 3600) return "há " + Math.floor(s / 60) + " min";
  if (s < 86400) return "há " + Math.floor(s / 3600) + " h";
  return "há " + Math.floor(s / 86400) + " d";
}
const hora = t => new Date(t * 1000).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit", second: "2-digit"});

function avisar(texto, erro) {
  const d = document.createElement("div");
  d.className = "aviso" + (erro ? " erro" : "");
  d.textContent = texto;
  $("#avisos").append(d);
  setTimeout(() => d.remove(), erro ? 7000 : 3500);
}
async function acao(nome, dados, ok) {
  try {
    const r = await fetch("/api/" + nome, {method: "POST", body: JSON.stringify(dados || {}),
      headers: {"Content-Type": "application/json", "X-Painel": "1"}});
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || "Não foi possível concluir.");
    if (ok || j.mensagem) avisar(ok || j.mensagem);
    atualizar();
    return true;
  } catch (err) { avisar(err.message, true); return false; }
}
// Atualiza só os cartões que mudaram, para não reiniciar vídeos nem fechar painéis.
// O painel se redesenha a cada 2 s. Se isso acontece entre apertar e soltar o mouse, o botão
// sob o cursor é trocado por outro igual e o navegador não conta o clique ("às vezes o
// Publicar não funciona"). Enquanto o mouse está apertado, o que está embaixo dele não muda.
let apertado = null;
document.addEventListener("pointerdown", ev => { apertado = ev.target; }, true);
document.addEventListener("pointerup", () => { apertado = null; }, true);
document.addEventListener("pointercancel", () => { apertado = null; }, true);
function sincronizar(caixa, itens, chave, html, classe) {
  const atuais = new Map([...caixa.children].map(el => [el.dataset.chave, el]));
  let anterior = null;
  for (const item of itens) {
    const k = String(chave(item));
    let el = atuais.get(k);
    if (!el) { el = document.createElement(caixa.tagName === "TBODY" ? "tr" : "div"); el.dataset.chave = k; if (classe) el.className = classe; }
    atuais.delete(k);
    const novo = html(item);
    const tocando = [...el.querySelectorAll("video")].some(v => !v.paused);
    const segurando = apertado && el.contains(apertado);
    if (el._html !== novo && !tocando && !segurando) { el.innerHTML = novo; el._html = novo; }
    else if (el._html !== novo && tocando && !segurando) {
      // Vídeo tocando: o player fica como está, mas a parte de baixo do cartão (textos e
      // botões, como as opções do "Publicar…") continua sendo atualizada.
      const corpo = el.querySelector(":scope > .corpo");
      if (corpo) {
        const molde = document.createElement("template");
        molde.innerHTML = novo;
        const novoCorpo = [...molde.content.children].find(n => n.classList.contains("corpo"));
        if (novoCorpo && corpo.innerHTML !== novoCorpo.innerHTML) corpo.innerHTML = novoCorpo.innerHTML;
      }
    }
    const esperado = anterior ? anterior.nextSibling : caixa.firstChild;
    if (el !== esperado) caixa.insertBefore(el, esperado);
    anterior = el;
  }
  for (const el of atuais.values()) el.remove();
}
const vazio = (titulo, texto) => `<div class="vazio"><b>${e(titulo)}</b>${e(texto)}</div>`;

// ---------- lives ----------
function grafico(l) {
  const v = l.historico, L = 300, A = 56, topo = Math.max(l.limiar * 1.6, ...v, 1);
  const y = n => (A - 4 - n / topo * (A - 8)).toFixed(1);
  const pts = v.map((n, i) => `${(i / 149 * L).toFixed(1)},${y(n)}`).join(" ");
  return `<svg class="grafico" viewBox="0 0 ${L} ${A}" preserveAspectRatio="none" role="img" aria-label="Empolgação nos últimos 5 minutos">
    <line x1="0" x2="${L}" y1="${y(l.limiar)}" y2="${y(l.limiar)}" stroke="var(--alerta)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <polyline points="${pts}" fill="none" stroke="var(--marca)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function cartaoLive(l) {
  const viva = l.status === "acompanhando" || l.status === "conectando";
  const rotulo = {conectando: "Conectando…", acompanhando: "Ao vivo", encerrada: "Encerrada", erro: "Erro"}[l.status];
  return `<div class="linha"><span class="pulso ${viva ? "" : "parado"}"></span>
      <span class="selo ${l.status === "erro" ? "erro" : ""}">${rotulo}</span>
      ${l.teste ? '<span class="selo teste">Teste</span>' : ""}
      <span class="espaco"></span>
      ${viva ? `<button class="btn mini perigo" data-acao="live/parar" data-id="${e(l.id)}">Parar</button>`
             : `<button class="btn mini" data-acao="live/fechar" data-id="${e(l.id)}">Fechar</button>`}</div>

      <div class="medida"><b>${l.chat_ativo ? l.mensagens_min : "—"}</b><span>${l.chat_ativo ? "mensagens/min" : "chat indisponível"}</span></div>
      <div class="medida"><b style="color:${l.nivel >= l.limiar ? "var(--marca)" : "inherit"}">${l.nivel.toFixed(1)}</b><span>empolgação (corta em ${l.limiar})</span></div>
      <div class="medida"><b>${l.cortes}</b><span>cortes gerados</span></div>

    ${l.passado ? `<div class="sub" style="margin-top:10px"><b>Antes do play:</b> ${e(l.passado.etapa)}${l.passado.cortes ? ` · ${l.passado.cortes} corte(s)` : ""}</div>` : ""}
    ${l.picos.length ? `<ul class="picos">${l.picos.slice().reverse().map(p =>
        `<li><time>${hora(p.hora)}</time><span><b>Pico ${p.nota}</b> — ${e(p.resultado)}</span></li>`).join("")}</ul>`
      : `<div class="sub" style="margin-top:10px">Nenhum pico ainda. O primeiro minuto serve para medir o ritmo normal da live.</div>`}`;
}

// ---------- análises ----------
function painelAnalise(id) {
  const a = analises[id];
  if (a === "carregando") return `<div class="analise sub">Carregando análise…</div>`;
  if (!a || a === "erro") return `<div class="analise sub">A análise deste vídeo não está disponível.</div>`;
  const L = 1000, A = 120, topo = Math.max(...a.pontos, 1), d = a.duracao || a.pontos.length;
  const cor = c => c.escolhido ? "var(--ok)" : c.aprovado ? "var(--alerta)" : "var(--erro)";
  const faixas = a.candidatos.map(c => `<rect x="${(c.inicio / d * L).toFixed(1)}" width="${Math.max(3, (c.fim - c.inicio) / d * L).toFixed(1)}" y="0" height="${A}" fill="${cor(c)}" opacity=".28"><title>${e(tempo(c.inicio))} – nota ${Math.round(c.nota)}</title></rect>`).join("");
  const pts = a.pontos.map((n, i) => `${(i / Math.max(1, a.pontos.length - 1) * L).toFixed(1)},${(A - 4 - n / topo * (A - 10)).toFixed(1)}`).join(" ");
  const ytId = a.video_id || id, temYt = /^[\w-]{11}$/.test(ytId);
  const SITUACOES = {cortado: ["Cortado", "ok"], reprovado: ["Reprovado pela IA", "erro"],
    abaixo: [`Abaixo da nota mínima${a.nota_minima ? ` (${a.nota_minima})` : ""}`, "alerta"],
    repetido: ["Repetido", "alerta"], fora: ["Ficou de fora (limite por vídeo)", "alerta"]};
  const linhas = a.candidatos.map((c, pos) => ({...c, pos})).sort((x, y) => y.nota - x.nota).map(c => {
    const chave = `${id}:${c.pos}`, g = (estado && estado.trechos || {})[chave];
    const sit = g && g.status === "feito" ? "cortado"
      : c.situacao || (c.escolhido ? "cortado" : c.aprovado ? "fora" : "reprovado");
    const [rotulo, tipo] = SITUACOES[sit] || SITUACOES.fora;
    let acoes = "";
    if (sit !== "cortado") {
      acoes = (temYt ? `<button class="btn mini" data-previa="${e(chave)}" aria-label="Assistir este trecho">${previas.has(chave) ? "Fechar vídeo" : "▶ Assistir trecho"}</button>` : "")
        + (g && g.status === "rodando" ? `<span class="sub">Gerando: ${e(g.etapa)}…</span>`
          : `<button class="btn mini principal" data-acao="trecho/cortar" data-video="${e(id)}" data-pos="${c.pos}" data-ok="Gerando o corte deste trecho. Ele aparece na aba Cortes, em modo teste, em cerca de um minuto." aria-label="Gerar corte deste trecho">Gerar corte deste trecho</button>`);
    } else if (g && g.status === "feito") {
      acoes = `<button class="btn mini" data-ir="cortes">Ver na aba Cortes</button>`;
    }
    const erro = g && g.status === "erro" ? `<div class="msg-erro">${e(g.erro)}</div>` : "";
    const previa = previas.has(chave) && temYt ? `<tr><td colspan="4"><iframe class="previa-yt" title="Trecho ${e(tempo(c.inicio))} a ${e(tempo(c.fim))}" src="https://www.youtube-nocookie.com/embed/${e(ytId)}?start=${Math.floor(c.inicio)}&end=${Math.ceil(c.fim)}&autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;max-width:640px;aspect-ratio:16/9;border:0;border-radius:8px"></iframe></td></tr>` : "";
    return `<tr>
      <td class="num">${tempo(c.inicio)} – ${tempo(c.fim)}<div class="sub">${Math.round(c.fim - c.inicio)} s</div></td>
      <td class="num"><b>${Math.round(c.nota)}</b></td>
      <td><span class="selo ${tipo}">${rotulo}</span></td>
      <td><b>${e(c.titulo)}</b>${c.gancho ? `<div class="sub">Gancho: “${e(c.gancho)}”</div>` : ""}<div class="sub">${e(c.motivo)}</div>
        ${acoes ? `<div class="acoes" style="margin-top:6px">${acoes}</div>` : ""}${erro}</td></tr>${previa}`;
  }).join("");
  return `<div class="analise">
    <svg class="linha-tempo" viewBox="0 0 ${L} ${A}" preserveAspectRatio="none" role="img" aria-label="Pontuação ao longo do vídeo">${faixas}
      <polyline points="${pts}" fill="none" stroke="var(--texto)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>
    <div class="eixo"><span>0:00</span><span>${tempo(d / 2)}</span><span>${tempo(d)}</span></div>
    <div class="legenda"><span><i style="background:var(--ok)"></i>Cortado</span><span><i style="background:var(--alerta)"></i>Ficou de fora (nota, repetição ou limite)</span><span><i style="background:var(--erro)"></i>Reprovado</span>
      <span>Sinais: ${e(Object.keys(a.sinais).join(", "))}${a.com_ia ? " + IA" : " (sem IA)"}</span></div>
    <div class="rolagem"><table><thead><tr><th>Trecho</th><th>Nota</th><th>Resultado</th><th>Título e motivo</th></tr></thead><tbody>${linhas}</tbody></table></div>
  </div>`;
}
const previas = new Set();  // trechos da análise com o vídeo aberto ("video:posição")
const botaoAnalise = id =>`<button class="btn mini" data-analise="${e(id)}">${abertas.has(id) ? "Ocultar análise" : "Ver análise"}</button>`;

function cartaoAnterior(h) {
  const selo = {feito: ["Analisado", "ok"], teste: ["Analisado em teste", "teste"], parcial: ["Cancelada", ""],
                erro: ["Erro", "erro"]}[h.status] || ["Analisado", ""];
  return `<div class="linha"><span class="selo ${selo[1]}">${selo[0]}</span><span class="selo">análise anterior</span>

function cartaoTarefa(t) {
  const agendada = t.status === "agendada";
  const rodando = ["identificando", "fila", "rodando", "pausado"].includes(t.status);
  const selo = t.cancelar && (rodando || agendada) ? ["Cancelando", "alerta"]
    : ({identificando: ["Identificando", "info"], fila: ["Na fila", ""], rodando: ["Analisando", "info"],
        pausado: ["Pausada", "alerta"], feito: ["Concluído", "ok"], erro: ["Erro", "erro"],
        cancelado: ["Cancelada", ""], agendada: ["Live agendada", "info"]}[t.status]);
  let meio = "";
  if (agendada) {
    const quando = t.inicio_live ? `Começa ${horaPrevista(t.inicio_live)} (${t.inicio_live > Date.now() / 1000 ? faltam(t.inicio_live) : "no horário marcado; aguardando entrar no ar"}).`
                                 : "O YouTube não informou o horário.";
    meio = `<div class="sub" style="margin-top:8px">${quando} O acompanhamento começa sozinho quando a live entrar no ar.<br>${e(t.etapa)}…</div>`;
  } else if (rodando) {
    const pct = t.fracao == null ? null : Math.round(t.fracao * 100);
    const etapa = t.status === "pausado" ? `Pausada em: ${t.etapa}` : t.etapa;
    meio = `<div class="barra ${pct == null && t.status !== "pausado" ? "livre" : ""}"><i style="${pct == null ? "" : `width:${pct}%`}"></i></div>
      <div class="sub">${e(etapa)}${pct == null ? "" : ` · ${pct}%`} · ${tempo(Date.now() / 1000 - t.inicio)}</div>`;
  } else if (t.status === "feito") {
    meio = `<div class="sub" style="margin-top:8px">${t.cortes ? `${t.cortes} ${t.cortes === 1 ? "corte gerado" : "cortes gerados"}` : "Nenhum trecho atingiu a nota mínima"} em ${tempo(t.fim - t.inicio)}${t.teste ? " · nada foi publicado" : ""}.</div>`;
  } else if (t.status === "cancelado") {
    meio = `<div class="sub" style="margin-top:8px">Análise cancelada. ${t.cortes ? `${t.cortes} ${t.cortes === 1 ? "corte pronto foi mantido" : "cortes prontos foram mantidos"} na aba Cortes.` : "Nenhum corte tinha ficado pronto."} Enviar o vídeo de novo continua sem repetir os trechos já cortados.</div>`;
  } else {
    meio = `<div class="msg-erro">${e(t.erro)}</div>`;
  }
  return `<div class="linha"><span class="selo ${selo[1]}">${selo[0]}</span>
      ${t.teste ? '<span class="selo teste">Teste</span>' : ""}
      ${t.origem !== "manual" ? `<span class="selo">${e(t.origem)}</span>` : ""}
      <span class="espaco"></span>
      ${t.status === "feito" ? botaoAnalise(t.video_id) : ""}
      ${["feito", "cancelado"].includes(t.status) && t.cortes ? `<button class="btn mini" data-ir="cortes">Ver cortes</button>` : ""}
      ${rodando && !t.cancelar ? (t.pausar
        ? `<button class="btn mini" data-acao="tarefa/retomar" data-id="${e(t.id)}" data-ok="Análise retomada." aria-label="Retomar a análise">▶ Retomar</button>`
        : `<button class="btn mini" data-acao="tarefa/pausar" data-id="${e(t.id)}" data-ok="A análise pausa ao fim da etapa atual." aria-label="Pausar a análise">⏸ Pausar</button>`)
        + `<button class="btn mini perigo" data-acao="tarefa/cancelar" data-id="${e(t.id)}" data-confirmar="Cancelar esta análise? Os cortes já prontos ficam salvos." data-ok="Cancelando ao fim da etapa atual. Os cortes prontos ficam salvos." aria-label="Cancelar a análise">✕ Cancelar</button>` : ""}
      ${agendada && !t.cancelar ? `<button class="btn mini perigo" data-acao="tarefa/cancelar" data-id="${e(t.id)}" data-confirmar="Parar de esperar por esta live?" data-ok="Espera cancelada." aria-label="Cancelar a espera pela live">✕ Cancelar</button>` : ""}
      ${t.status === "erro" ? `<button class="btn mini" data-acao="tarefa/tentar_de_novo" data-id="${e(t.id)}" data-ok="Enviado de novo, com as mesmas opções." aria-label="Tentar de novo esta análise">↻ Tentar de novo</button>` : ""}
      ${rodando || agendada ? "" : `<button class="btn mini" data-acao="tarefa/fechar" data-id="${e(t.id)}">Fechar</button>`}</div>
    <h3 style="margin-top:10px">${e(t.titulo)}</h3>
    <div class="sub">${e(t.canal)}</div>${meio}
    ${t.status === "feito" && abertas.has(t.video_id) ? painelAnalise(t.video_id) : ""}`;
}

// ---------- cortes ----------
const NOMES_CRITERIOS = {gancho: "Gancho", emocao: "Emoção", clareza: "Clareza", compartilhavel: "Compartilhável"};
function criterios(n) {
  if (!n || !Object.keys(n).length) return "";
  return `<div class="criterios">${Object.entries(NOMES_CRITERIOS).map(([k, nome]) =>
    `<span>${nome}</span><div class="barra"><i style="width:${n[k] || 0}%"></i></div><b>${n[k] ?? "—"}</b>`).join("")}</div>`;
}
const vistas = p => p.vistas == null ? "" : ` · ${Number(p.vistas).toLocaleString("pt-BR")} visualizações`;
function seloPlataforma(nome, p, c, chave) {
  if (p.situacao === "não se aplica") return "";
  const conta = estado && estado.contas ? estado.contas[chave] : null;
  if (c && conta && conta.ativo && conta.conectado && c.existe && ["na fila", "falhou"].includes(p.situacao)) {
    // Clicar no selo publica na hora (pede confirmação, para não sair sem querer).
    const dica = p.situacao === "falhou" ? "falhou · tentar de novo ▶"
      : p.previsto && p.previsto.quando ? `${p.previsto.posicao}º na fila · ${horaPrevista(p.previsto.quando)} · publicar ▶`
      : "na fila · publicar ▶";
    const balao = p.situacao === "falhou" ? `Falhou: ${p.erro || "erro"}. Clique para tentar de novo.`
      : `${p.previsto && p.previsto.quando ? `Sai ${horaPrevista(p.previsto.quando)} (${faltam(p.previsto.quando)}). ` : ""}Clique para publicar agora.`;
    return `<button class="selo quebra ${p.situacao === "falhou" ? "erro" : "info"}" data-acao="corte/publicar" data-id="${c.id}" data-plataforma="${chave}" data-confirmar="Publicar agora no ${nome}?" data-ok="Publicação iniciada no ${nome}." title="${e(balao)}" aria-label="Publicar agora no ${nome}">${nome}: ${e(dica)}</button>`;
  }
  const tipo = {publicado: "ok", "na fila": "info", enviando: "info", falhou: "erro", teste: "", aguardando: "alerta"}[p.situacao];
  let texto = p.situacao === "teste" ? "não enviado" : p.situacao === "aguardando" ? "aguardando você" : p.situacao;
  if (p.situacao === "enviando" && p.envio)
    texto = `enviando${p.envio.fracao == null ? "…" : ` ${Math.round(p.envio.fracao * 100)}%`}`;
  if (p.situacao === "na fila" && p.previsto)
    texto = p.previsto.quando ? `${p.previsto.posicao}º na fila, sai ${horaPrevista(p.previsto.quando)}` : `na fila (${MOTIVOS_FILA[p.previsto.motivo] || ""})`;
  return `<span class="selo quebra ${tipo}" title="${e(p.erro)}">${nome}: ${e(texto)}${vistas(p)}</span>`;
}
function ajusteCorte(c) {
  const r = c.refazendo;
  if (r && r.status === "rodando")
    return `<div class="sub" style="margin-top:8px"><span class="selo info">Refazendo</span> ${e(r.etapa)}…</div>`;
  if (!c.ajustavel) return "";
  const aviso = r && r.status === "erro" ? `<div class="msg-erro">${e(r.erro)}</div>`
    : r && r.status === "feito" ? `<div class="sub">Corte refeito. Confira o vídeo acima.</div>` : "";
  const dur = c.fim - c.inicio;
  return `<details class="ajuste-corte" ${r ? "open" : ""}><summary>Ajustar começo e fim</summary>
    <div class="sub">Hoje: ${tempo(c.inicio)} a ${tempo(c.fim)} (${Math.round(dur)} s). Use segundos: negativo é antes, positivo é depois.</div>
    <div class="linha" style="margin-top:6px;gap:12px;flex-wrap:wrap">
      <label class="sub">Começo <input type="number" step="1" value="0" data-ajuste-ini="${c.id}" style="width:80px" aria-label="Segundos para mudar o começo do corte"></label>
      <label class="sub">Fim <input type="number" step="1" value="0" data-ajuste-fim="${c.id}" style="width:80px" aria-label="Segundos para mudar o fim do corte"></label>

    </div>
    <div class="linha" style="margin-top:6px;gap:6px;flex-wrap:wrap">
      <span class="sub">Atalhos:</span>
      <button class="btn mini" data-atalho="${c.id}" data-campo="fim" data-seg="10" aria-label="Terminar 10 segundos depois">Fim +10 s</button>
      <button class="btn mini" data-atalho="${c.id}" data-campo="fim" data-seg="20" aria-label="Terminar 20 segundos depois">Fim +20 s</button>
      <button class="btn mini" data-atalho="${c.id}" data-campo="ini" data-seg="-5" aria-label="Começar 5 segundos antes">Começo −5 s</button>
      <button class="btn mini" data-atalho="${c.id}" data-campo="fim" data-seg="-5" aria-label="Terminar 5 segundos antes">Fim −5 s</button>
    </div>${aviso}</details>`;
}
function cartaoCorte(c) {
  return `${c.existe ? `<video src="/midia/${c.id}?v=${encodeURIComponent(c.versao)}" controls preload="${c.capa ? "none" : "metadata"}" playsinline ${c.capa ? `poster="/capa/${c.id}?v=${encodeURIComponent(c.versao)}"` : ""}></video>`
                     : `<div class="sem-arquivo">Arquivo removido</div>`}
    <div class="corpo">
      <div class="linha"><span class="nota">${Math.round(c.nota)}</span><span class="sub">nota · ${tempo(c.inicio)}–${tempo(c.fim)} · ${ha(c.criado)}</span></div>
      <h4>${e(c.titulo)}</h4>
      ${c.gancho ? `<div class="sub">Gancho: “${e(c.gancho)}”</div>` : ""}
      ${c.narracao ? `<div class="sub">Narração: “${e(c.narracao)}”</div>` : ""}

      </div>
      ${ajusteCorte(c)}

}
// Publicar… → você escolhe: agora ou fila. Nada entra na fila sem essa escolha.
let filtroFila = "fila";
try { filtroFila = localStorage.getItem("filtroFila") || "fila"; } catch (err) {}
document.addEventListener("change", ev => {
  if (ev.target.id !== "filtro-fila") return;
  filtroFila = ev.target.value;
  try { localStorage.setItem("filtroFila", filtroFila); } catch (err) {}
  if (estado) desenhar();
});
const decidindo = new Set();
const marcadas = new Map();  // corte -> plataformas marcadas no "Publicar…"
document.addEventListener("change", ev => {
  const caixa = ev.target.closest("[data-plat-corte]");
  if (!caixa) return;
  const sel = marcadas.get(Number(caixa.dataset.platCorte)) || new Set();
  caixa.checked ? sel.add(caixa.value) : sel.delete(caixa.value);
  marcadas.set(Number(caixa.dataset.platCorte), sel);
});
const PLATS = ["yt", "ig", "tt"], NOME_PLAT = {yt: "YouTube", ig: "Instagram", tt: "TikTok"};
const naFila = c => PLATS.some(p => ["na fila", "falhou"].includes(c[p].situacao));
function botoesDecisao(c) {
  const pendentes = c.teste ? PLATS.filter(p => c[p].situacao !== "não se aplica") : (c.aguardando || []);
  let html = "";
  if (pendentes.length) {
    if (!decidindo.has(c.id)) {
      html += `<button class="btn mini principal" data-decidir="${c.id}" aria-label="Escolher onde e como publicar este corte">Publicar…</button>`;
    } else {
      if (!marcadas.has(c.id)) marcadas.set(c.id, new Set(pendentes));
      const caixa = (p, nome) => pendentes.includes(p)
        ? `<label class="sub" style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" data-plat-corte="${c.id}" value="${p}" ${marcadas.get(c.id).has(p) ? "checked" : ""}> ${nome}</label>` : "";
      html += `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%">
        <span class="sub">Onde?</span>${caixa("yt", "YouTube")}${caixa("ig", "Instagram")}${caixa("tt", "TikTok")}</div>
        <button class="btn mini principal" data-decisao="agora" data-id="${c.id}" aria-label="Publicar agora nas plataformas marcadas">▶ Publicar agora</button>
        <button class="btn mini" data-decisao="fila" data-id="${c.id}" aria-label="Colocar na fila das plataformas marcadas">＋ Colocar na fila</button>
        <button class="btn mini" data-decidir="${c.id}" aria-label="Cancelar">Cancelar</button>`;
    }
  }
  if (!c.teste && naFila(c))
    html += `<button class="btn mini" data-acao="corte/tirar_da_fila" data-id="${c.id}" data-ok="Corte tirado da fila. Ele fica aguardando você." aria-label="Tirar da fila de postagem">Tirar da fila</button>`;
  return html;
}
// ---------- filtro da aba Cortes (fica salvo neste computador) ----------
const filtro = {periodo: "tudo", de: "", ate: "", situacao: "todos"};
try { Object.assign(filtro, JSON.parse(localStorage.getItem("filtroCortes") || "{}")); } catch (err) {}
function intervaloFiltro() {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const d = hoje.getTime() / 1000, dia = 86400;
  const data = (txt, fim) => txt ? new Date(`${txt}T00:00`).getTime() / 1000 + (fim ? dia : 0) : (fim ? Infinity : 0);
  return ({hoje: [d, Infinity], ontem: [d - dia, d], 7: [d - 6 * dia, Infinity], 30: [d - 29 * dia, Infinity],
           mes: [new Date(hoje.getFullYear(), hoje.getMonth(), 1).getTime() / 1000, Infinity],
           personalizado: [data(filtro.de, false), data(filtro.ate, true)]})[filtro.periodo] || [0, Infinity];
}
function passaFiltro(c) {
  const [de, ate] = intervaloFiltro();
  if (c.criado < de || c.criado >= ate) return false;
  const publicado = PLATS.some(p => c[p].situacao === "publicado");
  const pendente = PLATS.some(p => ["na fila", "enviando", "falhou"].includes(c[p].situacao));
  return ({teste: c.teste, fila: !c.teste && pendente, publicados: publicado})[filtro.situacao] ?? true;
}

const dataCurta = ts => new Date(ts * 1000).toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit", year: "numeric"});

// Cada grupo (vídeo ou live) tem cabeçalho e lista de cartões atualizados em separado: um
// corte novo entra na lista sem redesenhar os outros vídeos do grupo (antes o grupo inteiro
// era refeito e os players recarregavam).
function sincronizarGrupos(caixa, grupos) {
  const atuais = new Map([...caixa.children].map(el => [el.dataset.chave, el]));
  let anterior = null;
  for (const g of grupos) {
    let el = atuais.get(g.video_id);
    if (!el || !el.querySelector(":scope > .cortes")) {
      el = document.createElement("div"); el.className = "grupo"; el.dataset.chave = g.video_id;
      el.innerHTML = '<div class="cab-grupo"></div><div class="cortes"></div>';
    }
    atuais.delete(g.video_id);
    const cab = el.firstElementChild, novo = cabecalhoGrupo(g);
    if (cab._html !== novo && !(apertado && cab.contains(apertado))) { cab.innerHTML = novo; cab._html = novo; }
    sincronizar(el.lastElementChild, g.cortes, c => c.id, cartaoCorte, "corte");
    const esperado = anterior ? anterior.nextSibling : caixa.firstChild;
    if (el !== esperado) caixa.insertBefore(el, esperado);
    anterior = el;
  }
  for (const el of atuais.values()) el.remove();
}
// Ordem fixa: cada vídeo/live fica onde apareceu (pelo primeiro corte dele, mais novos em
// cima). Um corte novo de uma live não joga mais o grupo dela para o topo.
const primeiroCorte = new Map();
function ordemDosGrupos(grupos) {
  for (const g of grupos) {
    const ini = Math.min(...g.cortes.map(c => c.criado));
    if (!primeiroCorte.has(g.video_id) || ini < primeiroCorte.get(g.video_id)) primeiroCorte.set(g.video_id, ini);
  }
  return [...grupos].sort((a, b) => primeiroCorte.get(b.video_id) - primeiroCorte.get(a.video_id));
}
function cabecalhoGrupo(g) {
  const datas = g.cortes.map(c => c.criado), maisNovo = Math.max(...datas), maisVelho = Math.min(...datas);
  const quando = dataCurta(maisNovo) === dataCurta(maisVelho) ? dataCurta(maisNovo) : `${dataCurta(maisVelho)} a ${dataCurta(maisNovo)}`;
  return `<div class="linha"><h2>${e(g.titulo)}</h2>
      <span class="selo" title="Data dos cortes">${quando}</span>
      <span class="selo">${g.origem === "live" ? "Live" : "Vídeo"}</span>
      ${g.cortes.some(c => c.origem === "compilacao") ? '<span class="selo ok">com compilação</span>' : ""}
      <span class="sub">${e(g.canal)}${g.canal ? " · " : ""}${g.cortes.length} ${g.cortes.length === 1 ? "corte" : "cortes"}</span>
      <span class="espaco"></span>${g.origem === "live" ? "" : botaoAnalise(g.video_id)}</div>
    ${abertas.has(g.video_id) ? painelAnalise(g.video_id) + '<div style="height:12px"></div>' : ""}`;
}

function horaPrevista(ts) {
  const d = new Date(ts * 1000), hoje = new Date(), amanha = new Date(Date.now() + 86400e3);
  const hm = d.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
  if (d.toDateString() === hoje.toDateString()) return `às ${hm}`;
  if (d.toDateString() === amanha.toDateString()) return `amanhã às ${hm}`;
  return `${d.toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"})} às ${hm}`;
}
function faltam(ts) {
  const m = Math.max(0, Math.round((ts - Date.now() / 1000) / 60));
  if (m < 1) return "em instantes";
  if (m < 60) return `em ${m} min`;
  if (m < 1440) return `em ${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ""}`;
  const dias = Math.floor(m / 1440), horas = Math.floor((m % 1440) / 60);
  return `em ${dias} ${dias === 1 ? "dia" : "dias"}${horas ? ` e ${horas} h` : ""}`;
}

  const atalho = ev.target.closest("[data-atalho]");
  if (atalho) {  // soma os segundos ao campo e refaz direto
    const id = atalho.dataset.atalho, campo = atalho.dataset.campo;
    const ini = document.querySelector(`[data-ajuste-ini="${id}"]`), fim = document.querySelector(`[data-ajuste-fim="${id}"]`);
    (campo === "ini" ? ini : fim).value = Number((campo === "ini" ? ini : fim).value || 0) + Number(atalho.dataset.seg);
    return acao("corte/refazer", {id, inicio: ini.value, fim: fim.value}, "Refazendo o corte. Leva cerca de um minuto.");
  }
  const refazer = ev.target.closest("[data-refazer]");
  if (refazer) {
    if (refazer.disabled) return;
    refazer.disabled = true;
    const id = refazer.dataset.refazer;
    await acao("corte/refazer", {id, inicio: document.querySelector(`[data-ajuste-ini="${id}"]`).value,
      fim: document.querySelector(`[data-ajuste-fim="${id}"]`).value}, "Refazendo o corte. Leva cerca de um minuto.");
    refazer.disabled = false;
    return;
  }
  const b = ev.target.closest("[data-acao],[data-analise],[data-ir]");
  if (!b) return;
  if (b.dataset.ir) return abrirAba(b.dataset.ir);
  if (b.dataset.analise) {
    const id = b.dataset.analise;
    if (abertas.has(id)) abertas.delete(id);
    else {
      abertas.add(id);
      if (!analises[id] || analises[id] === "erro") {
        analises[id] = "carregando";
        fetch("/api/analise/" + encodeURIComponent(id)).then(r => r.ok ? r.json() : Promise.reject())
          .then(j => analises[id] = j, () => analises[id] = "erro").then(desenhar);
      }
    }
    return desenhar();
  }
  if (b.dataset.confirmar && !confirm(b.dataset.confirmar)) return;
  const {acao: nome, ok, ...dados} = b.dataset;
  delete dados.confirmar;
  if (b.disabled) return;  // trava de clique duplo: espera a resposta da ação
  if (b.tagName === "BUTTON") b.disabled = true;
  acao(nome, dados, ok).finally(() => { b.disabled = false; });
});
document.addEventListener("change", ev => {
  if (ev.target.id === "auto") acao("publicacao_auto", {ligada: ev.target.checked}, ev.target.checked ? "Publicação automática ligada." : "Publicação automática pausada.");
  if (ev.target.dataset.seguir) acao("canal/seguir", {id: ev.target.dataset.seguir, seguir: ev.target.checked});
});

let inicial = "lives";
try { inicial = localStorage.getItem("aba") || inicial; } catch (err) {}
abrirAba(inicial);
aplicarFiltroNaTela();
$("#filtro-fila").value = filtroFila;
atualizar();
setInterval(atualizar, 2000);
</script>
